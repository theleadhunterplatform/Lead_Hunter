# Lead Hunter — Render Blueprint
# Dashboard → New → Blueprint → connect this repo (main)
# After create: set secret env vars in each service, then run db push in API Shell.

services:
  - type: web
    name: lead-hunter-api
    runtime: node
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENV
        value: production
      - key: DB_MODE
        value: supabase
      - key: USE_CLOUD_REDIS
        value: "true"
      - key: REQUIRE_SIGNUP_APPROVAL
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: lead-hunter-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: lead-hunter-redis
          type: keyvalue
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SETTINGS_ENCRYPTION_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Platform Admin
      - key: APIFY_API_TOKEN
        sync: false
      - key: OPEN_ROUTER_API
        sync: false

  - type: web
    name: lead-hunter-web
    runtime: node
    plan: starter
    region: oregon
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false

  - type: keyvalue
    name: lead-hunter-redis
    plan: starter
    region: oregon
    ipAllowList: []

databases:
  - name: lead-hunter-db
    plan: basic-256mb
    region: oregon
