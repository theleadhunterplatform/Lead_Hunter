services:
  redis:
    image: redis:7-alpine
    container_name: lead-hunter-redis
    ports:
      - "6379:6379"
    volumes:
      - lead-hunter-redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  lead-hunter-redis-data:
